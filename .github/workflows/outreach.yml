name: Daily Outreach

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  outreach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyyaml gspread google-auth google-auth-oauthlib google-auth-httplib2 fastapi uvicorn jinja2 python-multipart python-dotenv tenacity httpx beautifulsoup4 lxml requests aiofiles serpapi anthropic

      - name: Run Pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          DRY_RUN: "false"
          DATABASE_PATH: data/leadhunter.db
          ANTHROPIC_MODEL: claude-haiku-4-5
        run: |
          CITIES=("Phoenix" "Tampa" "Austin" "Dallas" "Atlanta" "Nashville" "Charlotte" "Raleigh" "Scottsdale" "Boise" "Salt Lake City" "Denver" "Las Vegas" "Orlando" "San Antonio")
          CITY=${CITIES[$RANDOM % ${#CITIES[@]}]}
          echo "Running pipeline for: $CITY"
          python main.py --city "$CITY" --category "dentist" --discover --limit 10
          python main.py --city "$CITY" --category "dentist" --verify --limit 20
          python main.py --score --limit 50
          python enrich.py
          python main.py --city "$CITY" --personalize --limit 10
          python approve.py
          python main.py --city "$CITY" --outreach --limit 10