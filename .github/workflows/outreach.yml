name: Daily Outreach

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  outreach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        continue-on-error: true
        run: |
          pip install -r requirements.txt
          pip install pyyaml gspread google-auth google-auth-oauthlib google-auth-httplib2 fastapi uvicorn jinja2 python-multipart python-dotenv tenacity httpx beautifulsoup4 lxml requests aiofiles serpapi anthropic

      - name: Pick today's target
        id: pick
        run: |
          CITIES=("Beverly Hills" "Miami" "Austin" "Scottsdale" "Charlotte" "Manhattan" "Newport Beach")
          CATEGORIES=("real estate agent" "insurance agency" "law firm" "med spa" "mortgage broker" "real estate agent" "med spa")
          DOW=$(date +%u)
          IDX=$((DOW % 7))
          CITY=${CITIES[$IDX]}
          CAT=${CATEGORIES[$IDX]}
          echo "city=$CITY" >> $GITHUB_OUTPUT
          echo "cat=$CAT" >> $GITHUB_OUTPUT
          echo "Today ($DOW): $CAT in $CITY"

      - name: Auto-heal database
        continue-on-error: true
        env:
          DATABASE_PATH: data/leadhunter.db
        run: python autoheal.py

      - name: Discover
        continue-on-error: true
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          DATABASE_PATH: data/leadhunter.db
        run: python main.py --city "${{ steps.pick.outputs.city }}" --category "${{ steps.pick.outputs.cat }}" --discover --limit 15

      - name: Verify
        continue-on-error: true
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          DATABASE_PATH: data/leadhunter.db
        run: python main.py --city "${{ steps.pick.outputs.city }}" --category "${{ steps.pick.outputs.cat }}" --verify --limit 25

      - name: Score
        continue-on-error: true
        env:
          DATABASE_PATH: data/leadhunter.db
        run: python main.py --score --limit 50

      - name: Enrich emails
        continue-on-error: true
        env:
          DATABASE_PATH: data/leadhunter.db
        run: python enrich.py

      - name: Personalize
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5
          DATABASE_PATH: data/leadhunter.db
        run: python main.py --city "${{ steps.pick.outputs.city }}" --personalize --limit 15

      - name: Approve (non-interactive)
        continue-on-error: true
        env:
          DATABASE_PATH: data/leadhunter.db
        run: python approve.py

      - name: Outreach
        continue-on-error: true
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DATABASE_PATH: data/leadhunter.db
          DRY_RUN: "false"
        run: python main.py --city "${{ steps.pick.outputs.city }}" --outreach --limit 15